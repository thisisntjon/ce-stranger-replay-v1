name: Public fixture verification

concurrency:
  group: public-fixture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-demo:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    timeout-minutes: 10
    steps:
      - name: Check out fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run public fixture
        run: python examples/public_demo/ci_replay.py --output .tmp/ci-${{ matrix.os }}-py${{ matrix.python }}
      - name: Verify published oracle
        run: python examples/public_demo/verify_receipt.py .tmp/ci-${{ matrix.os }}-py${{ matrix.python }}/run/RECEIPT.json --output .tmp/ci-${{ matrix.os }}-py${{ matrix.python }}/run/ORACLE-DECISION.json
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-fixture-receipts-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            .tmp/ci-${{ matrix.os }}-py${{ matrix.python }}/run/RECEIPT.json
            .tmp/ci-${{ matrix.os }}-py${{ matrix.python }}/run/RESULT.json
            .tmp/ci-${{ matrix.os }}-py${{ matrix.python }}/run/REPORT.md
            .tmp/ci-${{ matrix.os }}-py${{ matrix.python }}/run/ORACLE-DECISION.json
            .tmp/ci-${{ matrix.os }}-py${{ matrix.python }}/replay-receipt.json
            .tmp/ci-${{ matrix.os }}-py${{ matrix.python }}/replay.log
          if-no-files-found: error
