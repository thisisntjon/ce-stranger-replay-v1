name: Public fixture verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-demo:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11']
    steps:
      - name: Check out fixture
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run public fixture
        run: python examples/public_demo/ci_replay.py --output .tmp/ci-${{ matrix.os }}
      - name: Verify published oracle
        run: python examples/public_demo/verify_receipt.py .tmp/ci-${{ matrix.os }}/run/RECEIPT.json --output .tmp/ci-${{ matrix.os }}/run/ORACLE-DECISION.json
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-fixture-receipts-${{ matrix.os }}
          path: |
            .tmp/ci-${{ matrix.os }}/run/RECEIPT.json
            .tmp/ci-${{ matrix.os }}/run/RESULT.json
            .tmp/ci-${{ matrix.os }}/run/REPORT.md
            .tmp/ci-${{ matrix.os }}/run/ORACLE-DECISION.json
            .tmp/ci-${{ matrix.os }}/replay-receipt.json
            .tmp/ci-${{ matrix.os }}/replay.log
          if-no-files-found: error

