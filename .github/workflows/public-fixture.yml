name: Public fixture verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fixture
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run public fixture
        run: python examples/public_demo/run_public_demo.py --output .tmp/public-demo-run
      - name: Verify published oracle
        run: python examples/public_demo/verify_receipt.py .tmp/public-demo-run/RECEIPT.json --output .tmp/public-demo-run/ORACLE-DECISION.json
      - name: Upload receipts
        uses: actions/upload-artifact@v4
        with:
          name: public-fixture-receipts
          path: |
            .tmp/public-demo-run/RECEIPT.json
            .tmp/public-demo-run/RESULT.json
            .tmp/public-demo-run/REPORT.md
            .tmp/public-demo-run/ORACLE-DECISION.json

